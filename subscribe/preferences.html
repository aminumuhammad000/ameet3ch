<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Email Preferences | Amee Technology Ltd</title>
    <link rel="icon" href="/images/ameelogo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <style>
        :root {
            --primary: #6C2BD9;
            --primary-dark: #581CBA;
            --bg: #F8FAFC;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 580px;
            width: 100%;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; color: var(--text-dark); }
        p { font-size: 14px; line-height: 1.6; color: var(--text-muted); margin-bottom: 24px; }
        .topics-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .topic-label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #F8FAFC;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .topic-label input { width: 18px; height: 18px; accent-color: var(--primary); }
        .btn {
            background: var(--primary);
            color: #ffffff;
            border: none;
            cursor: pointer;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
        }
        .btn:hover { background: var(--primary-dark); }
        .msg { display: none; padding: 12px; border-radius: 8px; margin-top: 16px; font-size: 14px; text-align: center; }
        .msg.success { display: block; background: #ECFDF5; color: #065F46; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Email Preferences</h1>
        <p>Choose which business technology updates and educational resources you would like to receive from Amee Technology Ltd:</p>
        <form id="pref-form">
            <div class="topics-group">
                <label class="topic-label">
                    <input type="checkbox" name="topic" value="Web Development" checked>
                    <span>Web Architecture & Corporate Portals</span>
                </label>
                <label class="topic-label">
                    <input type="checkbox" name="topic" value="AI Automation" checked>
                    <span>AI Systems & WhatsApp Business Automation</span>
                </label>
                <label class="topic-label">
                    <input type="checkbox" name="topic" value="SEO & Growth Marketing" checked>
                    <span>SEO & Organic Inbound Customer Acquisition</span>
                </label>
                <label class="topic-label">
                    <input type="checkbox" name="topic" value="Mobile Applications" checked>
                    <span>Mobile App Engineering & Fintech/VTU Systems</span>
                </label>
            </div>
            <button type="submit" class="btn">Save Preferences</button>
            <div id="pref-msg" class="msg"></div>
        </form>
    </div>
    <script>
        document.getElementById('pref-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const msg = document.getElementById('pref-msg');
            msg.className = 'msg success';
            msg.textContent = 'Your preferences have been successfully updated.';
        });
    </script>
</body>
</html>
